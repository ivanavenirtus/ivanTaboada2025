<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATBOT | Iván Taboada</title>
    <!-- Agregamos parámetros de versión para romper la caché del navegador de golpe -->
    <link rel="stylesheet" href="../css/style.css?v=5">
    <link rel="stylesheet" href="../css/chatStyle.css?v=5">
    <link rel="icon" href="../assets/icons/logo.png" type="image/png" sizes="24x24">
    <script src="../js/main.js" defer></script>
</head>

<body class="subpage">

    <header></header>

    <main class="wrap section">
        <div class="chat-shell">
            <h2 class="typewriter chat-title" data-text="Ask me anything!">Ask me anything!</h2>

            <div class="avatar-container">
                <img id="avatar-video" class="avatar" src="../assets/media/ivan_idle.gif" alt="Avatar de Iván" />
            </div>

            <div class="chat-container">
                <!-- --- BARRA TERMINAL --- -->
                <div class="chat-header">
                    <span class="chat-header-title">// IVANAVENIR_BOT</span>
                    <span class="chat-header-status">
                        <span class="status-dot"></span>
                        ONLINE
                    </span>
                </div>

                <!-- --- HISTORIAL DE CONVERSACIÓN --- -->
                <div id="chat-box" class="chat-box"></div>

                <!-- --- INPUT DE ENVÍO --- -->
                <form id="chat-form" class="input-area">
                    <input type="text" id="user-input" placeholder="Start typing..." required autocomplete="off" />
                    <button type="submit" id="send-btn" class="btn secondary">Send</button>
                </form>
            </div>
        </div>
    </main>

    <!-- --- LÓGICA DEL FRONTEND RESTRUCTURADA --- -->
    <script>
        const form = document.querySelector("#chat-form");
        const input = document.querySelector("#user-input");
        const chatBox = document.querySelector("#chat-box");
        const sendBtn = document.querySelector("#send-btn");
        const avatarVideo = document.querySelector("#avatar-video");

        const VIDEO_IDLE = "../assets/media/ivan_idle.gif";
        const VIDEO_TALKING = "../assets/media/ivan_talking.gif";

        let isTyping = false;

        function setAvatarState(src, talking) {
            if (!avatarVideo) return;
            if (avatarVideo.src !== new URL(src, window.location.href).href) {
                avatarVideo.src = src;
            }
            avatarVideo.classList.toggle("talking-ui", talking);
        }

        // CORRECCIÓN: Estructura exacta con wrappers y content independientes para el Usuario
        function appendMessage(sender, text) {
            if (!chatBox) return;
            
            const wrapper = document.createElement("div");
            wrapper.className = `message-wrapper ${sender}`;

            const nameEl = document.createElement("div");
            nameEl.className = "sender-name";
            nameEl.textContent = sender === "user" ? "USER" : "IVÁN";

            const contentEl = document.createElement("div");
            contentEl.className = "message-content";
            contentEl.textContent = text;

            wrapper.appendChild(nameEl);
            wrapper.appendChild(contentEl);
            chatBox.appendChild(wrapper);
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function postMessage(message) {
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message }),
                });

                const data = await res.json();
                return data.text || data.error || "No tengo respuesta.";
            } catch (error) {
                console.error("Error al enviar mensaje:", error);
                return "Ocurrió un error al enviar tu mensaje.";
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const message = input?.value.trim();
            if (!message || isTyping) return;

            appendMessage("user", message);
            if (input) input.value = "";
            if (sendBtn) sendBtn.disabled = true;

            isTyping = true;
            setAvatarState(VIDEO_TALKING, true);

            showTypingIndicator();

            const botReply = await postMessage(message);
            hideTypingIndicator();
            renderBotReply(botReply);
        }

        function showTypingIndicator() {
            if (!chatBox) return;
            const indicator = document.createElement("div");
            indicator.className = "typing-indicator";
            indicator.id = "typing-indicator";
            indicator.innerHTML = "<span></span><span></span><span></span>";
            chatBox.appendChild(indicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById("typing-indicator");
            if (indicator) indicator.remove();
        }

        // CORRECCIÓN: Estructura exacta con soporte para efecto Typewriter por caracteres en el bloque content
        function renderBotReply(text) {
            if (!chatBox) return;

            const wrapper = document.createElement("div");
            wrapper.className = "message-wrapper bot";

            const nameEl = document.createElement("div");
            nameEl.className = "sender-name";
            nameEl.textContent = "IVÁN";

            const contentEl = document.createElement("div");
            contentEl.className = "message-content";

            wrapper.appendChild(nameEl);
            wrapper.appendChild(contentEl);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            let index = 0;
            const speed = 30;

            function typeWriter() {
                if (index < text.length) {
                    contentEl.textContent += text[index++];
                    chatBox.scrollTop = chatBox.scrollHeight;
                    setTimeout(typeWriter, speed);
                    return;
                }
                isTyping = false;
                if (sendBtn) sendBtn.disabled = false;
                if (input) input.focus();

                // --- REPRODUCIR AUDIO CON FISH AUDIO ---
                // El avatar se detiene cuando el audio termina, no antes
                playTTS(text);
            }

            typeWriter();
        }

        async function playTTS(text) {
            // --- INTENTAR PRIMERO CON FISH AUDIO ---
            try {
                const res = await fetch("/api/tts", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text }),
                });

                if (res.ok) {
                    const blob = await res.blob();
                    const audioUrl = URL.createObjectURL(blob);
                    const audio = new Audio(audioUrl);
                    audio.onended = () => {
                        URL.revokeObjectURL(audioUrl);
                        setAvatarState(VIDEO_IDLE, false);
                    };
                    await audio.play();
                    return;
                }
                console.warn("Fish Audio falló (HTTP " + res.status + "), usando fallback Web Speech");
            } catch (error) {
                console.warn("Error Fish Audio, usando fallback Web Speech:", error);
            }

            // --- FALLBACK: WEB SPEECH API (TTS del navegador) ---
            speakWithBrowser(text);
        }

        function speakWithBrowser(text) {
            if (!("speechSynthesis" in window)) {
                console.error("Web Speech API no soportada en este navegador");
                setAvatarState(VIDEO_IDLE, false);
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "es-ES";
            utterance.rate = 1.4;
            utterance.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const spanishVoice = voices.find(v => v.lang.startsWith("es"));
            if (spanishVoice) utterance.voice = spanishVoice;

            utterance.onend = () => {
                setAvatarState(VIDEO_IDLE, false);
            };

            window.speechSynthesis.speak(utterance);
        }

        form?.addEventListener("submit", handleSubmit);
    </script>

</body>

</html>
