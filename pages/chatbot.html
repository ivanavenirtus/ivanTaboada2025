<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATBOT | Iván Taboada</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/chatStyle.css">
    <link rel="icon" href="../assets/icons/logo.png" type="image/png" sizes="24x24">
    <script src="../js/main.js" defer></script>
</head>

<body class="subpage">

    <header></header>

    <main class="wrap section">
        <div class="chat-shell">
            <h2 class="typewriter chat-title" data-text="Ask me anything!">Ask me anything!</h2>

            <div class="avatar-container">
                <img id="avatar-video" class="avatar" src="../assets/media/ivan_idle.gif" alt="Avatar de Iván" />
            </div>

            <div class="chat-container">
                <!-- HISTORIAL DE CONVERSACIÓN -->
                <div id="chat-box" class="chat-box"></div>

                <!-- INPUT DE ENVÍO -->
                <form id="chat-form" class="input-area">
                    <input type="text" id="user-input" placeholder="Start typing..." required autocomplete="off" />
                    <button type="submit" id="send-btn" class="btn secondary">Send</button>
                </form>
            </div>
        </div>
    </main>

    <!-- FRONTEND LOGIC INTEGRATION -->
    <script>
        const form = document.querySelector("#chat-form");
        const input = document.querySelector("#user-input");
        const chatBox = document.querySelector("#chat-box");
        const sendBtn = document.querySelector("#send-btn");
        const avatarVideo = document.querySelector("#avatar-video");

        const VIDEO_IDLE = "../assets/media/ivan_idle.gif";
        const VIDEO_TALKING = "../assets/media/ivan_talking.gif";

        let isTyping = false;

        function setAvatarState(src, talking) {
            if (!avatarVideo) return;
            if (avatarVideo.src !== new URL(src, window.location.href).href) {
                avatarVideo.src = src;
            }
            avatarVideo.classList.toggle("talking-ui", talking);
        }

        function appendMessage(sender, text) {
            if (!chatBox) return;
            const messageEl = document.createElement("div");
            messageEl.className = sender;
            messageEl.textContent = `${sender === "user" ? "USER:" : "IVÁN:"} ${text}`;
            chatBox.appendChild(messageEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function postMessage(message) {
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message }),
                });

                const data = await res.json();
                return data.text || data.error || "No tengo respuesta.";
            } catch (error) {
                console.error("Error al enviar mensaje:", error);
                return "Ocurrió un error al enviar tu mensaje.";
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const message = input?.value.trim();
            if (!message || isTyping) return;

            appendMessage("user", message);
            if (input) input.value = "";
            if (sendBtn) sendBtn.disabled = true;

            isTyping = true;
            setAvatarState(VIDEO_TALKING, true);

            const botReply = await postMessage(message);
            renderBotReply(botReply);
        }

        function renderBotReply(text) {
            if (!chatBox) return;

            const messageEl = document.createElement("div");
            messageEl.className = "bot";
            messageEl.textContent = "IVÁN: ";
            chatBox.appendChild(messageEl);
            chatBox.scrollTop = chatBox.scrollHeight;

            let index = 0;
            const speed = 30;

            function typeWriter() {
                if (index < text.length) {
                    messageEl.textContent += text[index++];
                    chatBox.scrollTop = chatBox.scrollHeight;
                    setTimeout(typeWriter, speed);
                    return;
                }
                isTyping = false;
                setAvatarState(VIDEO_IDLE, false);
                if (sendBtn) sendBtn.disabled = false;
                if (input) input.focus();
            }

            typeWriter();
        }

        form?.addEventListener("submit", handleSubmit);
    </script>

</body>

</html>
